<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Card Background -->
  <rect x="76" y="80" width="360" height="352" rx="36" fill="#1e293b" fill-opacity="0.75" stroke="#475569" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Financial Bar Chart -->
  <rect x="120" y="270" width="48" height="110" rx="10" fill="#64748b"/>
  <rect x="188" y="220" width="48" height="160" rx="10" fill="#6366f1"/>
  <rect x="256" y="170" width="48" height="210" rx="10" fill="#818cf8"/>
  <rect x="324" y="130" width="48" height="250" rx="10" fill="url(#accentGrad)"/>
  
  <!-- Trend Up Line with Node Points -->
  <path d="M 144 260 L 212 210 L 280 160 L 348 115" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Node Circles -->
  <circle cx="144" cy="260" r="8" fill="#fbbf24"/>
  <circle cx="212" cy="210" r="8" fill="#fbbf24"/>
  <circle cx="280" cy="160" r="8" fill="#fbbf24"/>
  <circle cx="348" cy="115" r="12" fill="#fbbf24" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Growth Arrow Head -->
  <path d="M 326 112 L 358 112 L 358 144" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Brand Text Pill -->
  <rect x="146" y="390" width="220" height="42" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="256" y="417" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1.5">NoBS FEASIBILITY</text>
</svg>
